name: Build release artifact

on:
  push:
    branches:
      - main

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_ENV: production
      APP_DEBUG: false
      APP_NAME: 'MC - Marketing & Code'
      APP_URL: 'https://mktcode.digital'
      VITE_APP_NAME: 'MC - Marketing & Code'
      VITE_APP_URL: 'https://mktcode.digital'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v6

      - name: Configurar PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, curl, dom, fileinfo, intl, pdo_mysql, zip
          coverage: none

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Preparar .env de build
        run: cp .env.example .env

      - name: Instalar dependências Composer
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Gerar APP_KEY temporária
        run: php artisan key:generate

      - name: Instalar dependências Node
        run: npm ci

      - name: Gerar build de produção
        run: npm run build:ssr

      - name: Montar diretório da release
        run: |
          RELEASE_DIR="/tmp/mktcode-release"

          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"

          rsync -a \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="tests" \
            --exclude="storage/logs/*" \
            --exclude="node_modules/.cache" \
            --exclude="release" \
            ./ "$RELEASE_DIR"/

      - name: Salvar metadados da build
        run: |
          echo "${GITHUB_SHA}" > /tmp/mktcode-release/COMMIT_SHA
          echo "${GITHUB_REF_NAME}" > /tmp/mktcode-release/COMMIT_BRANCH
          date -u +"%Y-%m-%dT%H:%M:%SZ" > /tmp/mktcode-release/BUILD_AT

      - name: Compactar release
        run: |
          tar -czf release.tar.gz -C /tmp/mktcode-release .

      - name: Publicar artifact
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: release.tar.gz
          retention-days: 7
