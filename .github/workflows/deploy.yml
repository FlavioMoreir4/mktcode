name: Deploy to production

on:
  workflow_run:
    workflows: ['Build release artifact']
    types:
      - completed

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # Só faz deploy se o build anterior tiver concluído com sucesso
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Baixar artifact da execução que disparou este workflow
        uses: actions/github-script@v7
        with:
          script: |
            const runId = context.payload.workflow_run.id;
            const { owner, repo } = context.repo;

            // Lista os artifacts da execução de build que acabou de rodar
            const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
              owner,
              repo,
              run_id: runId,
            });

            const artifact = artifacts.data.artifacts.find(a => a.name === 'release');

            if (!artifact) {
              core.setFailed('Artifact "release" não encontrado.');
              return;
            }

            // Baixa o artifact em formato zip
            const download = await github.rest.actions.downloadArtifact({
              owner,
              repo,
              artifact_id: artifact.id,
              archive_format: 'zip',
            });

            const fs = require('fs');
            fs.writeFileSync('release.zip', Buffer.from(download.data));

      - name: Extrair artifact
        run: |
          mkdir -p artifact
          unzip -o release.zip -d artifact
          ls -lah artifact

      - name: Enviar pacote ao servidor
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: './artifact/release.tar.gz'
          target: '/tmp/mktcode-deploy'

      - name: Publicar release no servidor
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            bash /www/wwwroot/mktcode.digital/bin/publish.sh /tmp/mktcode-deploy/artifact/release.tar.gz
